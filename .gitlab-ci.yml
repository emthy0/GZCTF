stages:
  - build
  - cleanup

variables:
  # Define if this is a release tag (v*.*.* or v*.*.*-patch.*)
  RELEASE: '$CI_COMMIT_TAG =~ /^v\d+(\.\d+){0,2}(-patch\.\d+)?$/ && ($CI_COMMIT_TAG !~ /-/ || $CI_COMMIT_TAG =~ /-patch\./'

build:
  stage: build
  image: ubuntu:24.04
  services:
    - docker:24.0-dind
  variables:
    # We'll use context flags instead of environment variables
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    # Install required packages
    - apt-get update && apt-get install -y curl gnupg apt-transport-https ca-certificates software-properties-common
    
    # Add Microsoft package repository for .NET
    - curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o packages-microsoft-prod.deb
    - dpkg -i packages-microsoft-prod.deb
    - apt-get update
    
    # Install .NET SDK (matching the global.json specification)
    - apt-get install -y dotnet-sdk-9.0
    
    # Install Docker client
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -
    - add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
    - apt-get update && apt-get install -y docker-ce-cli
    
    # Install Node.js
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    
    # Install pnpm
    - npm i -g pnpm
    
    # Login to GitLab Registry
    - docker --context default login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Set current datetime
    - CURRENT_DATETIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    
    # Setup QEMU for multi-arch builds
    - mkdir -p ~/.docker/cli-plugins/
    - curl -L https://github.com/docker/buildx/releases/download/v0.12.1/buildx-v0.12.1.linux-amd64 -o ~/.docker/cli-plugins/docker-buildx
    - chmod +x ~/.docker/cli-plugins/docker-buildx
    
    # Create Docker context for the Docker-in-Docker service
    - docker --context default context create dind-context --description "Docker in Docker Context" --docker "host=tcp://docker:2376,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    
    # Install QEMU for multi-arch support
    - docker --context dind-context run --rm --privileged multiarch/qemu-user-static --reset -p yes
    
    # Setup Docker Buildx with explicit context
    - docker --context dind-context buildx create --name mybuilder --use dind-context
    
    # Change to project directory
    - cd src/GZCTF
    
    # Build project
    - dotnet build "GZCTF.csproj" -c Release -o build
    
    # Publish project
    - >
      dotnet publish "GZCTF.csproj" -c Release -o publish/linux/amd64 -r linux-x64 --no-self-contained 
      /p:PublishReadyToRun=true
      -e VITE_APP_BUILD_TIMESTAMP=$CURRENT_DATETIME
      -e VITE_APP_GIT_SHA=$CI_COMMIT_SHA
      -e VITE_APP_GIT_NAME=$CI_COMMIT_REF_NAME
    
    # Only build arm64 for release tags
    - >
      if [ "$RELEASE" = "true" ]; then
        dotnet publish "GZCTF.csproj" -c Release -o publish/linux/arm64 -r linux-arm64 --no-self-contained 
        /p:PublishReadyToRun=true /p:EFOptimizeContext=false
        -e VITE_APP_BUILD_TIMESTAMP=$CURRENT_DATETIME
        -e VITE_APP_GIT_SHA=$CI_COMMIT_SHA
        -e VITE_APP_GIT_NAME=$CI_COMMIT_REF_NAME
      fi
    
    # Determine tags for the image
    - |
      TAGS=""
      # Add branch/tag reference
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
      
      # Add version tags for releases
      if [[ "$RELEASE" = "true" ]]; then
        # Add latest tag
        TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:latest"
        
        # Add major, major.minor, and major.minor.patch tags
        if [[ $CI_COMMIT_TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PATCH=${BASH_REMATCH[3]}
          
          TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:v$MAJOR"
          TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:v$MAJOR.$MINOR"
          TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:v$MAJOR.$MINOR.$PATCH"
        fi
      fi
    
    # Determine platforms
    - |
      if [[ "$RELEASE" = "true" ]]; then
        PLATFORMS="linux/amd64,linux/arm64"
      else
        PLATFORMS="linux/amd64"
      fi
    
    # Build and push the image
    - >
      docker --context dind-context buildx build
      --context .
      --push
      --platform $PLATFORMS
      $TAGS
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.created=$CURRENT_DATETIME"
      --label "org.opencontainers.image.version=$CI_COMMIT_REF_NAME"
      .
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^ci\/.*/
    - if: $CI_COMMIT_BRANCH =~ /^v.*/
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - src/**/*

cleanup:
  stage: cleanup
  image: 
    name: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
  script:
    # Get list of all container registry repositories
    - |
      echo "Cleaning up old container images..."
      
      # Get all repositories
      REPOSITORIES=$(curl --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories" | jq -r '.[].id')
      
      for repo_id in $REPOSITORIES; do
        # Get all tags for this repository
        TAGS=$(curl --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$repo_id/tags" | jq -r '.[].name')
        
        # Delete tags that don't match our patterns
        for tag in $TAGS; do
          # Keep latest, develop, and version tags
          if [[ "$tag" != "latest" && "$tag" != "develop" && ! "$tag" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Deleting tag: $tag"
            curl --request DELETE --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$repo_id/tags/$tag"
          fi
        done
        
        # Delete untagged images
        echo "Deleting untagged images for repository $repo_id"
        curl --request DELETE --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$repo_id/tags" --data "name_regex=.*" --data "keep_n=0" --data "name_regex_delete=.*-untagged"
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v.*/
  needs:
    - build
  allow_failure: true